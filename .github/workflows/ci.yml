# CI (C6.5). Releasing lives in release.yml, on its own tag trigger — this
# workflow never publishes. Keeping the two apart is what lets the release
# gate on `make check` without either workflow having to know the other's
# schedule. Actions are SHA-pinned (C6.5); bump the SHA and the trailing
# version comment together.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Install upstream Nix with a supported upstream-Nix installer.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix develop --command make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix develop --command make test
      - name: Race detector
        timeout-minutes: 10
        run: nix develop --command go test -race -count=1 ./...
      - name: Bounded parser fuzzing
        timeout-minutes: 5
        run: nix develop --command make fuzz

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix build
      - name: Review documentation
        run: bash contrib/review-documentation-ci

  # Build-only, not executed — no native darwin runner; cross-compilation
  # means the linux runner is sufficient.
  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { os: darwin, arch: arm64 }
          - { os: linux, arch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: build ${{ matrix.target.os }}/${{ matrix.target.arch }}
        run: |
          nix develop --command env \
            CGO_ENABLED=0 GOOS=${{ matrix.target.os }} GOARCH=${{ matrix.target.arch }} \
            go build -o dist/lds-${{ matrix.target.os }}-${{ matrix.target.arch }} ./cmd/lds
